x-stl-integration-bootstrap: &stl-integration-bootstrap
  STL_INTEGRATION_TOKEN_AUTO_PROVISION: "true"
  STL_INTEGRATION_BOOTSTRAP_SECRET: "${STL_BOOTSTRAP_SECRET:-stl-production-bootstrap-secret}"
  NexArr__BaseUrl: "${NEXARR_BASE_URL:-http://nexarr-api:8080}"

services:
  nexarr-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        PROJECT_PATH: apps/nexarr-api/NexArr.Api/NexArr.Api.csproj
        ASSEMBLY_NAME: NexArr.Api
    ports:
      - "8080:8080"
    environment:
      <<: *stl-integration-bootstrap
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: "${DATABASE_URL_NEXARR}"
      REDIS_URL: "${REDIS_URL}"
      OPENAI_ASSISTANT_MODEL: gpt-5.5
      OPENAI_SMART_IMPORT_MODEL: gpt-5.5
      TENANT_INTEGRATION_ENCRYPTION_KEY: "${TENANT_INTEGRATION_ENCRYPTION_KEY}"
      STL_SERVICE_NAME: nexarr-api

  staffarr-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        PROJECT_PATH: apps/staffarr-api/StaffArr.Api/StaffArr.Api.csproj
        ASSEMBLY_NAME: StaffArr.Api
    ports:
      - "8080"
    environment:
      <<: *stl-integration-bootstrap
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: "${DATABASE_URL_STAFFARR}"
      STL_SERVICE_NAME: staffarr-api

  trainarr-api:
