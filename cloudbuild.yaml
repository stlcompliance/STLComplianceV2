substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: stl-compliance
  _DEPLOYMENT_CONFIG: tools/gcp/deployment.json

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

steps:
  - id: validate-and-prepare
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 -m unittest discover -s tools/gcp -p 'test_*.py'
        python3 tools/gcp/deploy.py prepare --config "${_DEPLOYMENT_CONFIG}" \
          --project "$PROJECT_ID" --region "${_REGION}" \
          --repository "${_ARTIFACT_REPO}" --tag "$BUILD_ID"
        gcloud artifacts repositories describe "${_ARTIFACT_REPO}" \
          --project "$PROJECT_ID" --location "${_REGION}" >/dev/null

  - id: backend-tests
    name: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: bash
    args:
      - -ceu
      - |
        dotnet test STLCompliance.slnx --configuration Release --filter 'Category!=Live' --verbosity minimal --blame-hang --blame-hang-timeout 5m
        for PROJECT in tests/*/*.csproj; do
          if ! grep -Fq "Path=\"$$PROJECT\"" STLCompliance.slnx; then
            dotnet test "$$PROJECT" --configuration Release --filter 'Category!=Live' --verbosity minimal --blame-hang --blame-hang-timeout 5m
          fi
        done

  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -ceu
      - |
        REPO_URL="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}"
        while IFS=$$'\t' read -r NAME PROJECT ASSEMBLY KIND; do
          if [ "$$KIND" = frontend ]; then
            docker build -f docker/Dockerfile.frontend \
              --build-arg FRONTEND_APP="$$NAME" \
              --build-arg FRONTEND_ENV_JSON="$$(cat artifacts/gcp/frontend-build.json)" \
              --build-arg RUN_TESTS=true \
              -t "$$REPO_URL/$$NAME:$BUILD_ID" .
          else
            docker build -f "docker/Dockerfile.$$KIND" \
              --build-arg PROJECT_PATH="$$PROJECT" \
              --build-arg ASSEMBLY_NAME="$$ASSEMBLY" \
              -t "$$REPO_URL/$$NAME:$BUILD_ID" .
          fi
          docker push "$$REPO_URL/$$NAME:$BUILD_ID"
        done < artifacts/gcp/build.tsv

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: python3
    args:
      - tools/gcp/deploy.py
      - deploy
      - --config
      - ${_DEPLOYMENT_CONFIG}
      - --project
      - $PROJECT_ID
      - --region
      - ${_REGION}
      - --repository
      - ${_ARTIFACT_REPO}
      - --tag
      - $BUILD_ID
