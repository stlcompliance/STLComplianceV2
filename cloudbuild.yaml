# cloudbuild.yaml
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run compose up \
          --file docker-compose.yml \
          --file compose.override.yml \
          --region us-central1 \
          --quiet

# Add this block:
options:
  logging: CLOUD_LOGGING_ONLY