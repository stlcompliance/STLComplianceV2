# cloudbuild.yaml
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Install the compose component
        apt-get update && apt-get install -y google-cloud-cli-run-compose
        
        # 2. Deploy the stack
        gcloud run compose up docker-compose.prod.yml \
          --region us-central1 \
options:
  logging: CLOUD_LOGGING_ONLY